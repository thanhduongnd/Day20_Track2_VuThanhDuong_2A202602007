[project]
name = "day20-modelserving-lab"
version = "0.1.0"
description = "Day 20 (AICB-P2T2) lab — Model Serving & Inference Optimization (llama.cpp + Gemma 4 E2B)"
requires-python = ">=3.10"
readme = "README.md"

# Keep deps in requirements.txt — pyproject is here mostly so `pip install -e .` works.
dependencies = [
  "huggingface_hub>=0.24.0",
  "httpx>=0.27.0",
  "locust>=2.30.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
# bonus B5, Apple Silicon only. mlx-lm needs a build with a gemma4 model class;
# 0.31.3 is the version this lab was verified against.
mlx = ["mlx>=0.29", "mlx-lm>=0.31.3"]

[tool.setuptools]
# This isn't a package — students don't import lab modules. Skip auto-discovery.
py-modules = []
